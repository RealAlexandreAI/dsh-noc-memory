<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" role="img" aria-label="dsh-noc-memory — long-term memory for DeepSeek Harness">
  <title>dsh-noc-memory — long-term memory for DeepSeek Harness</title>
  <desc>Session-start boot plus memory tools, backed by your own Noc Memory MCP server.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#141226"/>
      <stop offset="1" stop-color="#1d1a38"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8f7cff"/>
      <stop offset="1" stop-color="#c3b6ff"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="300" rx="20" fill="url(#bg)"/>

  <text x="64" y="86" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="46" font-weight="700" fill="#f5f7fa">dsh-noc-memory</text>
  <text x="64" y="128" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="24" fill="#9aa7b8">Long-term memory for DeepSeek Harness</text>
  <rect x="64" y="150" width="200" height="6" rx="3" fill="url(#accent)"/>

  <!-- moon -->
  <circle cx="180" cy="228" r="46" fill="#e8e2ff" opacity="0.92"/>
  <circle cx="164" cy="216" r="40" fill="#141226"/>
  <circle cx="196" cy="244" r="9" fill="#8f7cff" opacity="0.35"/>
  <circle cx="158" cy="250" r="5" fill="#8f7cff" opacity="0.25"/>

  <!-- memory cards -->
  <rect x="290" y="182" width="240" height="92" rx="12" fill="#1a1730" stroke="#332e55" stroke-width="2"/>
  <text x="312" y="216" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" fill="#c3b6ff">noc_boot</text>
  <text x="312" y="246" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="16" fill="#9aa7b8">core memories + briefing</text>

  <rect x="556" y="182" width="240" height="92" rx="12" fill="#1a1730" stroke="#332e55" stroke-width="2"/>
  <text x="578" y="216" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" fill="#c3b6ff">noc://agent</text>
  <text x="578" y="246" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="16" fill="#9aa7b8">search / create / update</text>

  <!-- your server note -->
  <rect x="822" y="182" width="314" height="92" rx="12" fill="#1a1730" stroke="#332e55" stroke-width="2"/>
  <text x="844" y="216" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="20" font-weight="700" fill="#8f7cff">your MCP server</text>
  <text x="844" y="246" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="16" fill="#9aa7b8">memories never leave it</text>
</svg>
