# Plugin bundle for dsh-noc-memory.
# Registers the Noc Memory tools (noc_boot / read / search /
# create / update). Configure your own Nocturne MCP server:
#
#   - id: noc-memory
#     name: 'dsh-noc-memory'
#     config:
#       mcp_url: http://localhost:PORT/mcp
#       mcp_auth: Bearer <your token>
- insert:
    - id: noc-memory
      name: 'dsh-noc-memory'
